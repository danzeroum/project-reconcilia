name: validate-metadata

# Fiscal dos metadados declarativos, separado do qa.yml por clareza: roda a cada mudança de
# metadado ou código, independente da WebQA. Transforma divergência declaração×repositório em
# falha visível de CI (schema + existência de paths + coerência entre documentos).
#
# Chama ci/validate_all.py — o mesmo comando do governance.yml e do hook Stop do agente. Manter
# aqui uma lista própria de passos criaria duas definições de "verde": um PR poderia passar
# neste workflow e reprovar no outro, e ninguém saberia qual dos dois é "validado".
# Este workflow filtra por paths; governance.yml não filtra. É a diferença entre "mudou algo
# relevante" e "sempre".

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "project.yaml"
      - "business/**"
      - "architecture/**"
      - "design/**"
      - "governance/**"
      - "harness/schemas/**"
      - "harness/change-proposals/**"
      - "src/**"
      - "tests/**"
      - "ci/**"
      - "docs/metadata-graph.md"
      - "requirements-qa.txt"
      - "CLAUDE.md"
      - ".claude/**"

permissions:
  contents: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências do fiscal
        run: pip install "jsonschema>=4" "pyyaml>=6"
      # Genérico de propósito (CP-002): lê project.yaml e target.lock, não nomeia alvo algum.
      # Num molde imprime "nada a materializar" e sai 0; num derivado clona o alvo no SHA do
      # lock. Sem este passo, workspace/target não existe no runner e a invariante do código
      # órfão não chega a ser avaliada — o fiscal não reprova nem aprova, ele fica cego.
      - name: Materializar o alvo no SHA de target.lock
        run: python ci/bootstrap.py --skip-deps --no-validate
      # Passo SEPARADO, e é o que impede --no-validate de virar um jeito de não validar.
      # harness/stages.yaml referencia este passo pelo nome em enforced_by.
      - name: Validação total do projeto
        run: python ci/validate_all.py
