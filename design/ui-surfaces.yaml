# Superfícies de UI do ALVO, derivadas na fase ING-05-DESIGN.
#
# Uma por página real em conciliaai-frontend/src/pages/ — a proveniência aponta para o
# diretório da página, e a rota é a que docs/FRONTEND-SPECIFICATION.md declara.
#
# OS CRITÉRIOS DE ACEITE SÃO A PARTE FRACA DESTE ARQUIVO, e é melhor dizer do que deixar
# implícito: eles não foram lidos de nenhum documento do alvo, que descreve as telas mas não
# as condições de aceite. São a régua de experiência mínima que o agente reviewer usa, e
# pertencem ao julgamento humano da fase ING-07 tanto quanto risk_level pertence.
#
# 'satisfies' fica ausente de propósito: ligar tela a requisito exige saber qual story cada
# página atende, e o alvo não declara esse vínculo. Inventá-lo produziria a aresta que
# ALIGN-R3 existe para questionar.
