# Arquivos sob as raízes de código que deliberadamente não pertencem a componente algum.
# Isenção que não casa arquivo nenhum vira achado — é o que impede esta lista de virar um
# lugar onde pendência dorme. Os quatro são marcadores de pacote sem lógica de negócio.
exemptions:
  - path: workspace/target/src/__init__.py
    justification: "Marcador de pacote raiz: zero linhas de lógica. Atribuí-lo a um componente afirmaria uma relação de domínio que não existe."
  - path: workspace/target/src/domain/__init__.py
    justification: Marcador de pacote da camada de domínio, sem lógica. As três partes do domínio têm componentes próprios (entidades, objetos de valor e portas); o marcador não pertence a nenhuma delas.
  - path: workspace/target/src/application/__init__.py
    justification: Marcador de pacote da camada de aplicação, sem lógica. Os serviços, casos de uso e estratégias têm componentes próprios.
  - path: workspace/target/src/application/services/__init__.py
    justification: Marcador de pacote, sem lógica. Os onze serviços deste diretório foram distribuídos por capacidade entre sete componentes; o marcador não pertence a nenhum deles sem que a escolha seja arbitrária.
