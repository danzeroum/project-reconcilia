# Mudança proposta: reancorar as provas de mordida do CI no alvo materializado.
# DECLARADA E NÃO EXECUTADA (ADR-004). Schema: ../schemas/change-proposal.schema.json
#
# Registrada durante a adoção, ao descobrir que parte das provas de mordida herdadas do molde não
# sobrevive à derivação. Declarar a pendência é o oposto de escondê-la: sem este arquivo, o
# repositório teria um conjunto de passos negativos que passa a falhar por motivo estrutural, e
# alguém acabaria "consertando" cada um até o CI ficar verde — que é como uma prova de mordida
# vira uma prova de nada.
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

proposal:
  id: CP-001
  title: "Provas de mordida reancoradas no alvo: nem os passos negativos do CI nem tests/governance sobrevivem à derivação"
  author_kind: agent
  created_at: "2026-08-05T00:00:00Z"
  capabilities_affected: []
  components_affected: []

  risk_assessment:
    level: high
    risks:
      - RISK-CONF-001
      - RISK-DERIV-002
      - RISK-INGEST-001
    rationale: >
      MEDIDO NA ADOÇÃO DESTE REPOSITÓRIO, não previsto em tese. É a mesma forma dos CP-013,
      CP-015, CP-016 e CP-017 do molde: regra escrita para o molde, herdada pelo derivado, que
      só quebra quando um derivado real existe.

      .github/workflows/governance.yml prova que cada fiscal MORDE mutando uma cópia do
      repositório e exigindo que o fiscal reprove. O substrato dessas mutações é o negócio de
      exemplo do molde — src/project/pricing.py, src/project/ports.py, capabilities[0],
      components[0], ui_surfaces[0], tests/unit/. O CP-000 removeu esse substrato por construção,
      e sem ele os passos abaixo não provam mais o que anunciam:

        - (negativo) dado pessoal fora do inventário  — escreve em src/project/ports.py
        - (negativo) codigo orfao                     — escreve em src/project/novo_modulo.py
        - (negativo) raiz de código inexistente       — apaga $mut/src
        - (negativo) adapter que engole especificador — cria $mut/src/app/a.ts
        - (negativo) proveniência com SHA atrasado    — indexa components[0]
        - (negativo) pending_judgment em promovido    — indexa capabilities[0]
        - (negativo) capacidade critical sem risco    — indexa capabilities[0]
        - (negativo) superfície de UI órfã            — indexa ui_surfaces[0]
        - (negativo) ADR aceito sem asserção          — indexa adrs[4], hoje o ADR-005 superseded

      TRÊS FORAM TRATADOS NA PRÓPRIA ADOÇÃO, e só esses três, porque só neles a correção era
      dedutível sem executar o CI: dois passos foram REMOVIDOS junto com as asserções que
      provavam (ADR-005-A2 e ADR-008-A6, ambas inexistentes aqui — prova de mordida de trava
      inexistente não é prova), e "(negativo) derivado sem bloco target" foi corrigido de marcar
      kind:derived para REMOVER o bloco target, porque no molde a mutação alcançava um estado
      ilegal e aqui virava no-op — o passo provaria o oposto do que anuncia.

      O RESTO NÃO FOI IMPROVISADO, E É A DECISÃO CENTRAL DESTA PROPOSTA. Reescrever à mão nove
      mutações sutis sem poder executá-las produz o pior resultado disponível: um passo que sai
      verde pela razão errada, visualmente indistinguível de um fiscal que morde. Um passo
      negativo quebrado GRITA; um passo negativo que passa por acidente é a trava que o vigiado
      desligou sem tocar em nada.

      A FORMA DA CORREÇÃO, quando for executada:

        1. SUBSTRATO. As mutações que hoje escrevem em src/project/ passam a escrever em
           workspace/target/<raiz declarada>, o que exige um passo de bootstrap no job — o alvo
           precisa estar materializado no SHA do lock antes de qualquer mutação de código. Isso
           dá ao job uma dependência de rede que ele não tinha; a alternativa é um alvo sintético
           montado no próprio $mut, sem rede, com code_roots apontando para ele. A segunda é
           provavelmente melhor: prova a mesma coisa e não faz o CI do derivado depender da
           disponibilidade do repositório do alvo.

        2. ÍNDICE. Nenhuma mutação deve indexar coleção por posição. adrs[4] já aponta para outro
           ADR do que apontava quando foi escrita. Selecionar por predicado — "o primeiro ADR
           accepted", "a primeira capacidade" — e FALHAR EXPLICITAMENTE quando o predicado não
           casa nada, em vez de deixar o IndexError decidir o resultado do passo.

        3. VERIFICAÇÃO. Cada passo reancorado precisa ser observado falhando quando a trava é
           removida, não apenas passando. É o que distingue esta proposta de um conserto: o
           critério de aceite não é "o CI ficou verde", é "cada passo foi visto reprovando pela
           razão certa".

      NÃO É SÓ O WORKFLOW: tests/governance TEM O MESMO PROBLEMA, e maior. Medido nesta adoção,
      com o alvo já materializado: `pytest tests/governance` sai 47 failed / 94 passed aqui, e
      18/18 passed no molde para o mesmo arquivo test_inventario_bites.py. Não é regressão da
      adoção — é a mesma herança, na suíte que roda em DOIS workflows (o passo "Testes dos
      fiscais" de governance.yml e o de qa.yml). Verificado por eliminação: as falhas persistem
      com a árvore de trabalho revertida ao commit da adoção, então nenhuma delas vem de edição
      posterior.

      Os testes falham por duas causas, e a distinção importa para corrigir:

        (a) BASELINE. test_baseline_do_molde_esta_conforme afirma, no próprio nome, que o
            repositório está verde antes da mutação. Num derivado recém-adotado ele está
            vermelho POR CONSTRUÇÃO — 270 achados de código e teste órfão, um por arquivo do
            alvo — que é o que docs/COMO-ADOTAR.md descreve como o estado esperado. O teste não
            está errado; ele é sobre o molde. O equivalente aqui é "o baseline tem exatamente os
            achados que a fase de ingestão pendente explica, e nenhum outro" — uma afirmação
            mais forte, e que continua morde ndo depois que a ingestão fechar.

        (b) SUBSTRATO. O resto escreve em src/project/, indexa components[0]/capabilities[0] ou
            copia o repositório inteiro — incluindo agora workspace/target, o que também explica
            a suíte ter passado de segundos para 160s. Mesmo tratamento do item 1 acima: alvo
            sintético no tmp_path, sem rede e sem copiar o alvo real.

      São 47 testes em DEZ arquivos — a suíte inteira menos um. Medido com a execução completa,
      depois de uma primeira contagem truncada ter sugerido 24 em seis arquivos; o número menor
      estava errado e teria feito esta proposta subdimensionar o próprio escopo:

        test_conformance_bites.py   7      test_inventario_bites.py    7
        test_derivacao_bites.py     6      test_alinhamento_bites.py   5
        test_ingestao_bites.py      5      test_orientacao_bites.py    5
        test_bootstrap_bites.py     3      test_lgpd_bites.py          3
        test_seguranca_bites.py     3      test_sincronizacao_bites.py 3

      DIAGNÓSTICO DO exit 128, agora fechado. Era o único item desta proposta sem causa
      identificada, e a causa apareceu depois do CP-002 e da ingestão:

        subprocess.run(["git", "clone", str(alvo), str(root / "workspace/target")])

      falha porque o fixture repo_copy copia a árvore INTEIRA, e workspace/target agora existe e
      está cheio — o alvo materializado. `git clone` para diretório não vazio sai 128. O teste
      pressupunha um repositório onde o workspace ainda não tinha sido materializado, que era o
      estado normal antes e deixou de ser. Correção: remover o destino antes do clone.

      Só que corrigir isso NÃO deixa esses três verdes, e é por isso que não corrigi sozinho: a
      linha seguinte do mesmo fixture monta um componente com `capability: CAP-PRICING`, do
      negócio de exemplo que o CP-000 removeu. É o mesmo problema de substrato dos outros nove,
      escondido atrás de um erro de ambiente. Meia correção aqui produz churn sem verde e, pior,
      dá a impressão de que o teste foi consertado.

      SETE dos onze arquivos de tests/governance citam CAP-PRICING, CAP-CATALOG, CMP-PRICING ou
      src/project — dez ocorrências. É a medida exata do acoplamento entre a suíte de mordida e
      o negócio de exemplo do molde.

      PROGRESSO MEDIDO, para esta proposta não ser reaberta às cegas: 47 → 44 → 38 falhas
      (adoção → CP-002 → ingestão). A ingestão fechou nove sozinha, ao dar ao repositório
      metadado real onde os testes esperavam encontrar algum. As 38 que restam são as que
      dependem dos IDs do exemplo ou de escrever em src/project/.

      PIOR DO QUE QUEBRADOS: NÃO EXECUTAM. Medido no runner depois do CP-002, com o alvo já
      materializado — e é o achado que mais muda esta proposta. No job full-validation, o passo
      "Validação total do projeto" é o de número 6, e os 26 passos negativos são do 7 ao 32.
      Como o job para no primeiro passo que reprova, TODOS OS 26 SAEM 'skipped'. Não falharam:
      não rodaram.

      A consequência é desconfortável e precisa estar escrita: enquanto a linha de base deste
      repositório estiver vermelha — isto é, até a ingestão fechar —, a bateria inteira de
      provas de mordida do governance.yml é inalcançável. O CI não está verificando que os
      fiscais mordem; está verificando que a validação reprova, e parando aí. Um fiscal
      afrouxado por acidente nesse intervalo não seria pego por passo negativo algum.

      Isso reordena o trabalho desta proposta. Não adianta reancorar as mutações se elas
      continuam atrás de um gate que não abre: ou os passos negativos ganham
      `if: always()` (ou um job separado, que é mais limpo — eles não dependem do veredito da
      linha de base, só do ambiente), ou a linha de base precisa estar verde antes de eles
      valerem alguma coisa. A segunda opção amarra a prova de mordida ao progresso da ingestão,
      que é acoplamento que ninguém pediu. A primeira é preferível e deve vir ANTES da
      reancoragem: um passo negativo que não roda é indistinguível de um que passa.

      E ATINGE DOIS FISCAIS DECLARADOS EM harness/stages.yaml, que é onde deixa de ser
      inconveniência e vira buraco de governança. Medido no mesmo runner:

        - STAGE-TESTS declara enforced_by o passo "Testes dos fiscais" de governance.yml. É o
          passo 7, depois do 6 que reprova: sai 'skipped'.
        - STAGE-QA-CONFIG declara enforced_by o passo "Auditoria passiva (Trabalho A — só se
          escopo autorizar)" de qa.yml. Fica depois dos testes de mordida, que reprovam: sai
          'skipped'. O passo de inventário da suíte, ao lado dele, também.

      Duas etapas do repositório declaram fiscal que nunca executa. E o fiscal do fiscal não
      pega: audit_governance confere que o passo EXISTE com aquele nome, não que ele RODA. A
      régua da casa diz "etapa sem fiscal é achado"; hoje "etapa com fiscal inalcançável" não é
      achado nenhum, e as duas situações são indistinguíveis de fora. É a mesma distância entre
      "o fiscal existe" e "o fiscal morde" que esta suíte inteira existe para fechar, reaberta
      uma camada acima.

      Não proponho aqui a trava que fecharia isso — exigiria audit_governance ler o resultado do
      workflow, e um fiscal que depende de API do GitHub é outra decisão, com outro custo. O que
      esta proposta afirma é mais modesto e verificável: com os passos negativos fora do gate,
      as duas etapas voltam a ter fiscal que roda, e a lacuna some sem precisar da trava nova.

      Herança do molde outra vez, pelo mesmo mecanismo de sempre: lá a linha de base está
      sempre verde, então o passo 6 nunca reprova e a ordem dos passos nunca importou.

      E VALE PARA O MOLDE TAMBÉM. O molde não tem defeito enquanto for molde, mas todo derivado
      futuro herdará o mesmo problema no mesmo instante — esta adoção é a primeira medição dele.
      A correção estrutural pertence lá; esta proposta é o registro de onde ela dói primeiro.

  required_gates:
    - metadata-validation
    - unit-tests

  tests_required:
    - tests/governance/test_conformance_bites.py
    - tests/governance/test_derivacao_bites.py
    - tests/governance/test_inventario_bites.py

  human_approval_required: true
  change_mode: pull_request
